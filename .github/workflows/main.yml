name: Test Discord

on:
  schedule:
    - cron: "0 23 * * *"   # JST 8:00 = UTC 23:00（前日）
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install yfinance requests ta

      - run: python Notify_kabu.py
